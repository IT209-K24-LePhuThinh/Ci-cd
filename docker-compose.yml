services: 
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports: 
      - "8080:8085"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/taskdb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

volumes: 
  backend: